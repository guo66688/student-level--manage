basePath: /api
definitions:
  controllers.docModels:
    properties:
      chart_data:
        $ref: '#/definitions/models.ChartData'
      class:
        $ref: '#/definitions/models.ClassDoc'
      class_avg:
        $ref: '#/definitions/models.ClassAvgDoc'
      course:
        $ref: '#/definitions/models.CourseDoc'
      course_stats:
        $ref: '#/definitions/models.CourseStats'
      login_request:
        $ref: '#/definitions/models.LoginRequest'
      pass:
        $ref: '#/definitions/models.Pass'
      permission:
        $ref: '#/definitions/models.Permission'
      permission_doc:
        $ref: '#/definitions/models.PermissionDoc'
      result:
        $ref: '#/definitions/models.Result'
      role:
        $ref: '#/definitions/models.Role'
      role_doc:
        $ref: '#/definitions/models.RoleDoc'
      role_permission:
        $ref: '#/definitions/models.RolePermission'
      score:
        $ref: '#/definitions/models.ScoreDoc'
      score_rank:
        $ref: '#/definitions/models.ScoreRankRow'
      student:
        $ref: '#/definitions/models.StudentDoc'
      user:
        $ref: '#/definitions/models.UserDoc'
      user_role:
        $ref: '#/definitions/models.UserRole'
    type: object
  models.ChartData:
    properties:
      data_source_type:
        description: '"static" 或 "dynamic"'
        type: string
      id:
        type: string
      meta:
        additionalProperties: true
        type: object
      type:
        example: monthly
        type: string
      values: {}
    type: object
  models.Class:
    type: object
  models.ClassAvgDoc:
    properties:
      avg_score:
        example: 85.2
        type: number
      class_name:
        example: 高一1班
        type: string
    type: object
  models.ClassDoc:
    properties:
      created_at:
        example: "2024-01-01T12:00:00Z"
        type: string
      id:
        example: 1
        type: integer
      name:
        example: 高一1班
        type: string
      updated_at:
        example: "2024-01-01T12:00:00Z"
        type: string
    type: object
  models.Course:
    type: object
  models.CourseDoc:
    properties:
      course_code:
        example: MATH101
        type: string
      course_name:
        example: 数学
        type: string
      created_at:
        example: "2024-01-01T12:00:00Z"
        type: string
      credit:
        example: 3
        type: number
      id:
        example: 1
        type: integer
      teacher_id:
        example: 10
        type: integer
      updated_at:
        example: "2024-01-01T12:00:00Z"
        type: string
    type: object
  models.CourseStats:
    properties:
      avg_score:
        type: number
      course_name:
        type: string
      max_score:
        type: number
      min_score:
        type: number
    type: object
  models.LoginRequest:
    properties:
      password:
        example: "123456"
        type: string
      username:
        example: admin
        type: string
    type: object
  models.Pass:
    properties:
      course_id:
        description: ✅ 添加这一行
        type: integer
      course_name:
        type: string
      passed:
        type: integer
      rate:
        type: number
      total:
        type: integer
    type: object
  models.Permission:
    description: 权限定义，例如 "student:view"
    properties:
      created_at:
        example: 1716940800
        type: integer
      description:
        description: 权限说明
        example: 查看学生列表
        type: string
      id:
        example: 1
        type: integer
      name:
        description: 权限标识
        example: student:view
        type: string
      updated_at:
        example: 1716940800
        type: integer
    type: object
  models.PermissionDoc:
    properties:
      id:
        example: 1
        type: integer
      key:
        example: student:view
        type: string
      name:
        example: 学生管理
        type: string
    type: object
  models.Result:
    properties:
      avg:
        example: 82.7
        type: number
      month:
        example: 2024-06
        type: string
    type: object
  models.Role:
    description: 角色定义，例如 "admin"
    properties:
      created_at:
        example: 1716940800
        type: integer
      description:
        description: 角色说明
        example: 系统管理员
        type: string
      id:
        example: 1
        type: integer
      name:
        description: 角色标识
        example: admin
        type: string
      updated_at:
        example: 1716940800
        type: integer
    type: object
  models.RoleDoc:
    properties:
      created_at:
        example: "2024-01-01T12:00:00Z"
        type: string
      id:
        example: 1
        type: integer
      name:
        example: 管理员
        type: string
    type: object
  models.RolePermission:
    description: 角色与权限的绑定关系
    properties:
      id:
        example: 1
        type: integer
      permission_id:
        example: 2
        type: integer
      role_id:
        example: 1
        type: integer
    type: object
  models.Score:
    type: object
  models.ScoreDoc:
    properties:
      course_id:
        example: 101
        type: integer
      created_at:
        example: "2024-01-01T12:00:00Z"
        type: string
      exam_date:
        example: "2025-05-01"
        type: string
      id:
        example: 1
        type: integer
      score:
        example: 89.5
        type: number
      student_id:
        example: 1
        type: integer
      updated_at:
        example: "2024-01-01T12:00:00Z"
        type: string
    type: object
  models.ScoreRankRow:
    properties:
      avg_score:
        example: 87.5
        type: number
      student_name:
        example: 张三
        type: string
    type: object
  models.Student:
    type: object
  models.StudentDoc:
    properties:
      birth_date:
        example: "2005-09-01"
        type: string
      class_id:
        example: 2
        type: integer
      created_at:
        example: "2024-01-01T12:00:00Z"
        type: string
      gender:
        example: 男
        type: string
      id:
        example: 1
        type: integer
      name:
        example: 张三
        type: string
      student_no:
        example: "20230001"
        type: string
      updated_at:
        example: "2024-01-01T12:00:00Z"
        type: string
    type: object
  models.UserDoc:
    properties:
      created_at:
        example: "2024-01-01T12:00:00Z"
        type: string
      id:
        example: 1
        type: integer
      is_active:
        example: true
        type: boolean
      nickname:
        example: 管理员
        type: string
      password:
        example: "123456"
        type: string
      updated_at:
        example: "2024-01-01T12:00:00Z"
        type: string
      username:
        example: admin
        type: string
    type: object
  models.UserRole:
    description: 用户与角色的绑定关系
    properties:
      id:
        example: 1
        type: integer
      role_id:
        example: 1
        type: integer
      user_id:
        example: 3
        type: integer
    type: object
host: localhost:8080
info:
  contact:
    email: 1596740959@qq.com
    name: icoffee
  description: 用于管理学生、课程、成绩和图表数据的后台 API。
  title: 学生成绩管理系统 API
  version: "1.2"
paths:
  /analysis/class_avg:
    get:
      description: 获取每个班级的平均成绩，用于图表展示
      produces:
      - application/json
      responses:
        "200":
          description: 班级平均成绩数组
          schema:
            items:
              $ref: '#/definitions/models.ClassAvgDoc'
            type: array
        "500":
          description: 数据库查询失败
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 获取班级平均成绩
      tags:
      - analytics
  /analysis/exam_count:
    get:
      description: 按 course_id 和 exam_date 去重统计考试次数（即课程+考试日视为一次考试）
      produces:
      - application/json
      responses:
        "200":
          description: '格式: { \"total\": 23 }'
          schema:
            additionalProperties:
              type: integer
            type: object
        "500":
          description: 查询失败
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 获取考试总次数
      tags:
      - analytics
  /analysis/monthly:
    get:
      description: 获取每月平均成绩的时间序列数据
      produces:
      - application/json
      responses:
        "200":
          description: 月度平均成绩列表
          schema:
            items:
              $ref: '#/definitions/models.Result'
            type: array
        "500":
          description: 查询失败
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 获取月度平均成绩趋势
      tags:
      - analytics
  /analysis/pass_rate:
    get:
      description: 可选传入 course_id 获取单个课程，否则返回所有课程通过率
      parameters:
      - description: 课程 ID（可选，单个课程）
        example: 1001
        in: query
        name: course_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 通过率列表或单个课程分析
          schema:
            items:
              $ref: '#/definitions/models.Pass'
            type: array
        "500":
          description: 查询失败
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 获取课程通过率分析
      tags:
      - analytics
  /analysis/rank:
    get:
      description: 获取学生按平均成绩排名的前10名
      parameters:
      - description: 起始位置（默认0）
        example: 0
        in: query
        name: offset
        type: integer
      - description: 返回数量（默认10）
        example: 10
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 学生平均成绩排行榜
          schema:
            items:
              $ref: '#/definitions/models.ScoreRankRow'
            type: array
        "500":
          description: 数据库查询失败
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 获取成绩排行榜（含姓名）
      tags:
      - analytics
  /analysis/rank/all:
    get:
      description: 包含：学生平均成绩、课程平均成绩、班级平均成绩、课程通过率
      produces:
      - application/json
      responses:
        "200":
          description: 各类排行榜
          schema:
            additionalProperties: true
            type: object
        "500":
          description: 查询失败
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 获取全部排行榜数据
      tags:
      - analytics
  /analysis/rank/cache:
    delete:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: 清除结果
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 清除失败
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 清空成绩排行榜缓存
      tags:
      - analytics
  /analytics/course-stats:
    get:
      description: 获取每门课程的平均、最高和最低成绩
      produces:
      - application/json
      responses:
        "200":
          description: 课程统计列表
          schema:
            items:
              $ref: '#/definitions/models.CourseStats'
            type: array
        "500":
          description: 查询失败
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 获取课程统计
      tags:
      - analytics
  /api/students/{id}:
    delete:
      consumes:
      - application/json
      parameters:
      - description: 学生ID
        example: 1
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 返回信息
          schema:
            additionalProperties: true
            type: object
      summary: 删除学生
      tags:
      - students
  /api/students/by_class:
    get:
      consumes:
      - application/json
      parameters:
      - description: 班级名称
        example: '"软件一班"'
        in: query
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 返回信息
          schema:
            additionalProperties: true
            type: object
      summary: 根据班级获取学生
      tags:
      - students
  /auth/login:
    post:
      consumes:
      - application/json
      description: 用户登录，获取 JWT token
      parameters:
      - description: 登录请求
        in: body
        name: login
        required: true
        schema:
          $ref: '#/definitions/models.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 返回 token 信息
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 参数错误
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: 用户名或密码错误
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 登录
      tags:
      - 用户认证
  /charts:
    get:
      consumes:
      - application/json
      parameters:
      - default: 1
        description: 页码
        example: 1
        in: query
        name: page
        type: integer
      - default: 10
        description: 每页条数
        example: 10
        in: query
        name: size
        type: integer
      - description: 查询关键词
        example: '"成绩趋势"'
        in: query
        name: query
        type: string
      - description: 图表类型（可选）
        example: '"score-trend"'
        in: query
        name: type
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 包含图表列表和总数
          schema:
            additionalProperties: true
            type: object
        "500":
          description: 查询失败
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 图表列表
      tags:
      - charts
    post:
      consumes:
      - application/json
      parameters:
      - description: 图表数据
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/models.ChartData'
      produces:
      - application/json
      responses:
        "200":
          description: 返回信息
          schema:
            additionalProperties: true
            type: object
      summary: 新增图表
      tags:
      - charts
  /charts/{id}:
    delete:
      consumes:
      - application/json
      parameters:
      - description: 图表ID
        example: '"60f7d2f5e13f1e3c48a2a1a2"'
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 返回信息
          schema:
            additionalProperties: true
            type: object
      summary: 删除图表
      tags:
      - charts
    put:
      consumes:
      - application/json
      parameters:
      - description: 图表ID
        example: '"60f7d2f5e13f1e3c48a2a1a2"'
        in: path
        name: id
        required: true
        type: string
      - description: 图表数据
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/models.ChartData'
      produces:
      - application/json
      responses:
        "200":
          description: 返回信息
          schema:
            additionalProperties: true
            type: object
      summary: 更新图表
      tags:
      - charts
  /charts/data:
    delete:
      parameters:
      - description: 图表类型
        example: '"pass-rate"'
        in: query
        name: type
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 删除结果
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 参数缺失
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 删除失败
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 删除图表数据
      tags:
      - charts
    get:
      consumes:
      - application/json
      parameters:
      - description: 图表类型
        example: '"score-trend"'
        in: query
        name: type
        required: true
        type: string
      - description: 数据源类型
        example: '"static" 或 "dynamic"'
        in: query
        name: data_source_type
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 返回图表数据
          schema:
            additionalProperties: true
            type: object
        "500":
          description: 查询失败
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 获取图表数据
      tags:
      - charts
  /charts/types:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: 图表类型集合
          schema:
            items:
              type: string
            type: array
        "500":
          description: 查询失败
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 图表类型列表
      tags:
      - charts
  /classes:
    get:
      consumes:
      - application/json
      parameters:
      - description: 班级名称（支持模糊匹配）
        example: '"高一"'
        in: query
        name: name
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 返回班级列表和总数
          schema:
            additionalProperties: true
            type: object
      summary: 获取班级列表
      tags:
      - classes
    post:
      consumes:
      - application/json
      parameters:
      - description: 班级信息
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/models.Class'
      produces:
      - application/json
      responses:
        "200":
          description: 返回信息
          schema:
            additionalProperties: true
            type: object
      summary: 添加班级
      tags:
      - classes
  /classes/{id}:
    delete:
      consumes:
      - application/json
      parameters:
      - description: 班级ID
        example: 1
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 返回信息
          schema:
            additionalProperties: true
            type: object
      summary: 删除班级
      tags:
      - classes
    put:
      consumes:
      - application/json
      parameters:
      - description: 班级ID
        example: 1
        in: path
        name: id
        required: true
        type: integer
      - description: 班级信息
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/models.Class'
      produces:
      - application/json
      responses:
        "200":
          description: 返回信息
          schema:
            additionalProperties: true
            type: object
      summary: 更新班级
      tags:
      - classes
  /courses:
    get:
      consumes:
      - application/json
      description: 分页获取课程信息，并支持课程名称过滤
      parameters:
      - default: 1
        description: 页码
        example: 1
        in: query
        name: page
        type: integer
      - default: 10
        description: 每页条数
        example: 10
        in: query
        name: size
        type: integer
      - description: 搜索关键词
        example: '"高等数学"'
        in: query
        name: query
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 包含课程列表和总数
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 分页参数错误
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 查询失败
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 获取课程列表
      tags:
      - courses
    post:
      consumes:
      - application/json
      description: 新增一个课程记录
      parameters:
      - description: 课程信息
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/models.Course'
      produces:
      - application/json
      responses:
        "200":
          description: 返回添加的课程
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 参数错误
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 数据库写入失败
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 添加课程
      tags:
      - courses
  /courses/{id}:
    delete:
      description: 删除指定 ID 的课程
      parameters:
      - description: 课程ID
        example: 101
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 删除成功
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 删除失败
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 删除课程
      tags:
      - courses
    put:
      consumes:
      - application/json
      description: 根据 ID 更新课程信息
      parameters:
      - description: 课程ID
        example: 101
        in: path
        name: id
        required: true
        type: integer
      - description: 课程信息
        in: body
        name: course
        required: true
        schema:
          $ref: '#/definitions/models.Course'
      produces:
      - application/json
      responses:
        "200":
          description: 更新后的课程信息
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 参数错误
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: 未找到课程
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 更新课程
      tags:
      - courses
  /dashboard/stats:
    get:
      description: 包括学生数、课程数、班级数、平均成绩
      produces:
      - application/json
      responses:
        "200":
          description: 统计数据
          schema:
