        example: 1716940800
        type: integer
      description:
        description: 权限说明
        example: 查看学生列表
        type: string
      id:
        example: 1
        type: integer
      name:
        description: 权限标识
        example: student:view
        type: string
      updated_at:
        example: 1716940800
        type: integer
    type: object
