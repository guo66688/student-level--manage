# .air.toml (macOS 专用配置)
root = "."  # 项目根目录

[build]
cmd = "swag init && go build -o ./tmp/main ."  # 构建命令
bin = "./tmp/main"  # 输出的可执行文件

# ——监控配置
include_ext = ["go"]  # 只监听 go 文件
exclude_dir = ["assets", "vendor", "tmp", ".git", "node_modules", "docs"] # 忽略目录
delay = 2000  # 增加延迟
stop_on_error = true  # 编译失败时不继续执行

# ——优化输出
[color] 
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
clean_on_exit = false  # 禁用退出时清理 tmp 目录

